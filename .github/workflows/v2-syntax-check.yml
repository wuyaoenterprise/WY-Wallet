name: V2/V3 dependency, tests and smoke check

on:
  pull_request:
    paths:
      - "v2/**/*.py"
      - "v3/**/*.py"
      - "v2/requirements.txt"
      - "v3/requirements.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            v2/requirements.txt
            v3/requirements.txt
      - name: Install V3 dependencies
        run: |
          python -m pip install -r v3/requirements.txt
          python -m pip install pytest
          python -m pip check
      - name: Compile V2 and V3 Python files
        run: python -m compileall -q v2 v3
      - name: Reject legacy or deprecated runtime paths
        run: |
          ! grep -R "google.generativeai" v2 v3 --include='*.py'
          ! grep -R "exec(compile" v2 v3 --include='*.py'
          ! grep -R "source.replace" v2 v3 --include='*.py'
          ! grep -R "selection_mode=\"single-row\"" v2/wywallet/web.py
          ! grep -R "use_container_width" v2 v3 --include='*.py'
          grep -q 'GEMINI_MODEL = "gemini-3.7-flash"' v2/wywallet/config.py
          grep -q 'APP_TITLE = "WY Wallet V3"' v2/wywallet/config.py
          grep -q 'showSidebarNavigation = false' .streamlit/config.toml
      - name: Run regression and Streamlit AppTest suite
        env:
          PYTHONPATH: v2
        run: pytest -q v2/tests
      - name: Import application modules
        env:
          PYTHONPATH: v2
        run: python -c "import wywallet.web, wywallet.ai, wywallet.db, wywallet.analytics, wywallet.ui, wywallet.receipt, wywallet.exporting"
