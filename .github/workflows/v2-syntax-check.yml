name: V2 dependency and syntax check

on:
  pull_request:
    paths:
      - "v2/**/*.py"
      - "v2/requirements.txt"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "v2/requirements.txt"
      - name: Install V2 dependencies
        run: python -m pip install -r v2/requirements.txt
      - name: Compile all V2 Python files
        run: python -m compileall -q v2
