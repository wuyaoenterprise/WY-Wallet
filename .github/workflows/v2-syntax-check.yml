name: V3 release-gate validation

on:
  pull_request:
    paths:
      - "v3/**"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-syntax-check.yml"
  push:
    branches:
      - "agent/wy-wallet-v3"
      - "agent/wy-wallet-v3-finalize"
    paths:
      - "v3/**"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: v3/requirements.txt

      - name: Install V3 dependencies
        run: |
          python -m pip install -r v3/requirements.txt
          python -m pip install pytest
          python -m pip check

      - name: Compile V3 application
        run: python -m compileall -q v3

      - name: Reject obsolete or V2-coupled runtime patterns
        shell: bash
        run: |
          set -euo pipefail
          runtime_files=$(find v3 -type f -name '*.py' ! -path 'v3/tests/*')
          reject() {
            local pattern="$1"
            if grep -nE "$pattern" $runtime_files; then
              echo "Rejected runtime pattern: $pattern"
              exit 1
            fi
          }
          reject 'google\.generativeai'
          reject 'exec\(compile'
          reject 'source\.replace'
          reject 'use_container_width'
          reject '个人财务中心 · V2'
          reject 'WY_Wallet_V2_'
          reject 'v3_overrides'
          reject 'SHARED_WEB_CORE'
          reject 'ROOT / "v2"'
          reject 'runpy\.run_path'
          grep -q 'GEMINI_MODEL = "gemini-3.7-flash"' v3/wywallet/config.py
          grep -q 'APP_TITLE = "WY Wallet V3"' v3/wywallet/config.py
          grep -q 'APP_VERSION = "v3.2.3"' v3/wywallet/config.py
          grep -q 'showSidebarNavigation = false' .streamlit/config.toml

      - name: Run V3 release regressions
        env:
          PYTHONPATH: v3
        run: pytest -q v3/tests

      - name: Import V3 runtime modules
        env:
          PYTHONPATH: v3
        run: |
          python - <<'PY'
          import wywallet.access
          import wywallet.ai
          import wywallet.ai_page
          import wywallet.analytics
          import wywallet.dashboard_page
          import wywallet.db
          import wywallet.exporting
          import wywallet.ledger_codec
          import wywallet.receipt
          import wywallet.receipt_identity
          import wywallet.reports_page
          import wywallet.settings_page
          import wywallet.snapshot
          import wywallet.transactions_page
          import wywallet.ui
          import wywallet.ux
          print("V3 runtime imports OK")
          PY
