name: V3 dependency, regression and Streamlit smoke check

on:
  pull_request:
    paths:
      - "v3/**/*.py"
      - "v3/requirements.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-syntax-check.yml"
  push:
    branches:
      - "agent/wy-wallet-v3"
    paths:
      - "v3/**/*.py"
      - "v3/requirements.txt"
      - ".streamlit/config.toml"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: v3/requirements.txt
      - name: Install V3 dependencies
        run: |
          python -m pip install -r v3/requirements.txt
          python -m pip install pytest
          python -m pip check
      - name: Compile V3 application
        run: python -m compileall -q v3
      - name: Reject legacy, V2-coupled or monkey-patched runtime paths
        run: |
          ! grep -R "google.generativeai" v3 --include='*.py'
          ! grep -R "exec(compile" v3 --include='*.py'
          ! grep -R "source.replace" v3 --include='*.py'
          ! grep -R "use_container_width" v3 --include='*.py'
          ! grep -R "个人财务中心 · V2" v3 --include='*.py'
          ! grep -R "WY_Wallet_V2_" v3 --include='*.py'
          ! grep -R "v3_overrides" v3 --include='*.py'
          ! grep -R 'ROOT / "v2"' v3 --include='*.py'
          ! grep -R "SHARED_WEB_CORE" v3 --include='*.py'
          ! grep -R "runpy.run_path" v3 --include='*.py'
          grep -q 'GEMINI_MODEL = "gemini-3.7-flash"' v3/wywallet/config.py
          grep -q 'APP_TITLE = "WY Wallet V3"' v3/wywallet/config.py
          grep -q 'APP_VERSION = "2026.09.01-v3.2.0"' v3/wywallet/config.py
          grep -q 'BUILD_ID = "v3-final-hardening-r3"' v3/wywallet/config.py
          grep -q 'showSidebarNavigation = false' .streamlit/config.toml
      - name: Run shared finance and AI regressions against V3 core
        env:
          PYTHONPATH: v3
        run: pytest -q v2/tests/test_core.py v2/tests/test_ai_edge_semantics.py v2/tests/test_category_merge_literals.py
      - name: Run V3.2 direct-core regressions
        env:
          PYTHONPATH: v3
        run: pytest -q v3/tests/test_v3_final_overrides.py
      - name: Run V3 Streamlit AppTests
        env:
          PYTHONPATH: v3
        run: pytest -q v3/tests/test_streamlit_ui.py
      - name: Import V3 application modules
        env:
          PYTHONPATH: v3
        run: python -c "import wywallet.web, wywallet.ai, wywallet.db, wywallet.analytics, wywallet.ui, wywallet.receipt, wywallet.exporting"
