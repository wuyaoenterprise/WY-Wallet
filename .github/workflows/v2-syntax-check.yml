name: V2 syntax check

on:
  pull_request:
    paths:
      - "v2/**/*.py"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V2 entry points
        run: python -m py_compile v2/app.py v2/app_rich.py
