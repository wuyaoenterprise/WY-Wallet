name: V2 dependency, tests and smoke check

on:
  pull_request:
    paths:
      - "v2/**/*.py"
      - "v2/requirements.txt"
      - ".github/workflows/v2-syntax-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "v2/requirements.txt"
      - name: Install V2 dependencies
        run: |
          python -m pip install -r v2/requirements.txt
          python -m pip install pytest
      - name: Compile all V2 Python files
        run: python -m compileall -q v2
      - name: Reject legacy runtime patching and Gemini SDK
        run: |
          ! grep -R "google.generativeai" v2 --include='*.py'
          ! grep -R "exec(compile" v2 --include='*.py'
          ! grep -R "source.replace" v2 --include='*.py'
      - name: Run core tests
        env:
          PYTHONPATH: v2
        run: pytest -q v2/tests
      - name: Import application modules
        env:
          PYTHONPATH: v2
        run: python -c "import wywallet.web, wywallet.ai, wywallet.db, wywallet.analytics, wywallet.ui"
