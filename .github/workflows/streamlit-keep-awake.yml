name: Keep WY Wallet Streamlit awake

on:
  schedule:
    # GitHub cron uses UTC. Run every 3 hours at :37 to leave extra margin
    # against Streamlit's 12-hour inactivity window and avoid the busy top of hour.
    # Malaysia (UTC+8): 02:37, 05:37, 08:37, 11:37, 14:37, 17:37, 20:37, 23:37.
    - cron: "37 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wy-wallet-streamlit-heartbeat
  cancel-in-progress: false

jobs:
  reset-idle-timer:
    name: Reset Streamlit inactivity countdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployed V3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/wy-wallet-v3
          fetch-depth: 0

      - name: Push an empty heartbeat commit to the deployed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target_branch="agent/wy-wallet-v3"
          for attempt in 1 2 3; do
            git fetch origin "$target_branch"
            git checkout -B streamlit-heartbeat "origin/$target_branch"
            git commit --allow-empty -m "chore: reset Streamlit inactivity countdown [skip ci]"

            if git push origin "HEAD:$target_branch"; then
              echo "Heartbeat commit pushed to $target_branch."
              echo "This commit changes no application files; it only resets the Community Cloud inactivity countdown."
              exit 0
            fi

            echo "Push attempt $attempt failed because the branch moved; retrying on the latest head."
            sleep 10
          done

          echo "Unable to push the Streamlit heartbeat after 3 attempts."
          exit 1
