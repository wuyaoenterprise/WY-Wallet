name: Keep WY Wallet Streamlit awake

on:
  schedule:
    # GitHub Actions is busiest at the start of each hour, so run 15 minutes
    # before the desired Malaysia times to reduce schedule delays.
    # Malaysia is UTC+8: 22:45/06:45/14:45 UTC = 06:45/14:45/22:45 MYT.
    - cron: "45 22,6,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    name: Wake Streamlit app with a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Selenium client
        run: python -m pip install --quiet selenium

      - name: Open app and wake it if sleeping
        env:
          APP_URL: "https://wy-wallet-crgzso5tldztcphlmnm97m.streamlit.app/"
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException, WebDriverException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          app_url = os.environ["APP_URL"]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1280,900")
          options.add_argument("--lang=en-US")

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(90)

          sleep_markers = (
              "gone to sleep due to inactivity",
              "get this app back up",
              "this app has gone to sleep",
          )
          fatal_markers = (
              "gone over its resource limits",
              "oh no",
          )

          def body_text() -> str:
              try:
                  return driver.find_element(By.TAG_NAME, "body").text.casefold()
              except Exception:
                  return ""

          def is_sleeping(text: str) -> bool:
              return any(marker in text for marker in sleep_markers)

          def click_wake_button() -> bool:
              candidates = []
              xpaths = [
                  "//button[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'get this app back up')]",
                  "//a[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'get this app back up')]",
                  "//button[contains(translate(., 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'abcdefghijklmnopqrstuvwxyz'), 'wake')]",
              ]
              for xpath in xpaths:
                  try:
                      candidates.extend(driver.find_elements(By.XPATH, xpath))
                  except Exception:
                      pass
              for element in candidates:
                  try:
                      if element.is_displayed() and element.is_enabled():
                          driver.execute_script("arguments[0].click();", element)
                          print("Clicked Streamlit wake-up control.")
                          return True
                  except Exception:
                      continue
              return False

          try:
              try:
                  driver.get(app_url)
              except TimeoutException:
                  print("Initial page load timed out; continuing to inspect the page.")

              time.sleep(5)
              text = body_text()
              print(f"Initial page title: {driver.title!r}")
              print(f"Initial state: {'sleeping' if is_sleeping(text) else 'not sleeping'}")

              if is_sleeping(text):
                  if not click_wake_button():
                      print("Sleeping page detected but the wake-up control could not be found.")
                      print(text[:1200])
                      sys.exit(1)

              deadline = time.time() + 150
              last_text = text
              while time.time() < deadline:
                  time.sleep(8)
                  current = body_text()
                  last_text = current

                  if any(marker in current for marker in fatal_markers):
                      print("Streamlit returned an application/resource error instead of the app.")
                      print(current[:1200])
                      sys.exit(1)

                  if is_sleeping(current):
                      click_wake_button()
                      continue

                  if len(current.strip()) >= 20:
                      print("WY Wallet is awake and browser traffic reached the app.")
                      print(f"Final page title: {driver.title!r}")
                      sys.exit(0)

                  try:
                      driver.refresh()
                  except (TimeoutException, WebDriverException):
                      pass

              print("Could not confirm that WY Wallet left the sleeping page in time.")
              print(last_text[:1200])
              sys.exit(1)
          finally:
              driver.quit()
          PY
